# This is a Declarative Automation Bundle definition for bakehouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse_analytics
  uuid: 3cc72493-c955-40b4-85ed-7c8ffa97bbbc

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    # mode: development

    presets:
      name_prefix: dev_
    default: true
    workspace:
      host: https://dbc-f2651748-7aa3.cloud.databricks.com
    variables:
      catalog: dab_bakehouse_analytical_dev
      schema: rnd
  prod:
    mode: production
    presets:
      name_prefix: prod_
    workspace:
      host: https://dbc-f2651748-7aa3.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/nagesh.sdt@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/nagesh.sdt@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dab_bakehouse_analytical_prod
      schema: rnd
    permissions:
      - user_name: nagesh.sdt@gmail.com
        level: CAN_MANAGE
